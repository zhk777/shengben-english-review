# 无域名、使用公网 IP 的临时 HTTP 配置。
# 正式启用 HTTPS 和域名后，请改用 nginx.example.conf。
server {
    listen 80;
    server_name 39.96.66.252;

    root /var/www/shengben-review;
    index index.html;

    location = / {
        return 302 /college/;
    }

    location = /college {
        return 301 /college/;
    }

    location /college/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /college/health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    location /college/ {
        try_files $uri $uri/ /college/index.html;
    }
}
