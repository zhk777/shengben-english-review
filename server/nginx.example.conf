# 将 study.example.com 替换成你的真实域名，并把证书路径替换为 Certbot/Caddy 生成的路径。
server {
    listen 80;
    server_name study.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name study.example.com;

    ssl_certificate     /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/shengben-review;
    index index.html;

    location = / {
        return 302 /college/;
    }

    location / {
        try_files $uri $uri/ /college/index.html;
    }
    location = /college {
        return 301 /college/;
    }
    location /college/ {
        try_files $uri $uri/ /college/index.html;
    }
    location /college/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /college/health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
